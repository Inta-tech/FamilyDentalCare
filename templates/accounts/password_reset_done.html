{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent | Family Dental Care</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: #f5fafa; padding: 60px 0;">

<div class="container" style="max-width: 480px; margin: 0 auto; text-align: center;">
    <div class="booking-form-card" style="background: #ffffff; padding: 40px; border-radius: 18px; border: 1px solid #e0eeee;">
        <span style="font-size: 45px;">✉️</span>
        <h2 style="color: #173b3f; margin: 15px 0 10px;">Check Your Inbox</h2>
        <p style="color: #718487; font-size: 14px; margin-bottom: 25px;">
            We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive them shortly.
        </p>
        <a href="{% url 'login' %}" class="primary-button" style="display: inline-block; text-decoration: none;">Return to Login</a>
    </div>
</div>

</body>
</html>
