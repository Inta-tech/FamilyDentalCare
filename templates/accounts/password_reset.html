{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | {{ clinic_settings.name }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: #f5fafa; padding: 60px 0;">

<div class="container" style="max-width: 480px; margin: 0 auto;">
    <div class="booking-form-card" style="background: #ffffff; padding: 40px; border-radius: 18px; border: 1px solid #e0eeee;">
        <div class="form-header" style="margin-bottom: 25px; text-align: center;">
            <span style="color: #0b8f8f; font-weight: 800; font-size: 11px; letter-spacing: 1.5px;">ACCOUNT RECOVERY</span>
            <h2 style="color: #173b3f; margin-top: 6px;">Reset Password</h2>
            <p style="color: #718487; font-size: 14px;">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 22px;">
                <label style="display: block; font-weight: 700; font-size: 14px; color: #173b3f; margin-bottom: 8px;">Email Address</label>
                <input type="email" name="email" class="form-input" required placeholder="name@example.com">
            </div>

            <button type="submit" class="primary-button" style="width: 100%; border: none; cursor: pointer; padding: 13px; background: #0b8f8f; color: #fff; border-radius: 9px; font-weight: 700;">
                Send Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'login' %}" style="color: #0b8f8f; font-size: 14px; font-weight: 600;">← Back to Login</a>
        </div>
    </div>
</div>

</body>
</html>
