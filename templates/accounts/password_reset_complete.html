{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | {{ clinic_settings.name }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: #f5fafa; padding: 60px 0;">

<div class="container" style="max-width: 480px; margin: 0 auto; text-align: center;">
    <div class="booking-form-card" style="background: #ffffff; padding: 40px; border-radius: 18px; border: 1px solid #e0eeee;">
        <span style="font-size: 45px;">🎉</span>
        <h2 style="color: #173b3f; margin: 15px 0 10px;">Password Reset Complete</h2>
        <p style="color: #718487; font-size: 14px; margin-bottom: 25px;">
            Your password has been changed successfully. You can now log in with your new credentials.
        </p>
        <a href="{% url 'login' %}" class="primary-button" style="display: inline-block; text-decoration: none;">Log In Now</a>
    </div>
</div>

</body>
</html>
