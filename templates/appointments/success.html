{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Appointment Submitted | {{ clinic_settings.name }}</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<main>

<section class="booking-section">

    <div class="container">

        <div class="booking-card success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>Appointment Request Submitted!</h1>

            <p>
                Thank you for choosing {{ clinic_settings.name }}.
                Your appointment request has been received.
            </p>

            <p>
                Our clinic team will contact you to confirm
                the date and time.
            </p>

            <a href="/" class="primary-button">
                Back to Homepage
            </a>

        </div>

    </div>

</section>

</main>

</body>
</html>
